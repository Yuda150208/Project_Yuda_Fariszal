<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Modern</title>
    <style>
        /* Gaya Visual (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #4a148c;
            font-size: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Agar padding tidak merusak lebar */
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #764ba2;
            outline: none;
        }

        button {
            width: 100%;
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #5a368c;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #2e7d32;
            display: none; /* Sembunyi dulu */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Absensi Digital</h2>
        
        <div class="input-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu...">
        </div>

        <div class="input-group">
            <label for="id">Nomor ID / Absen</label>
            <input type="number" id="id" placeholder="Contoh: 12">
        </div>

        <button onclick="kirimAbsen()">Kirim Kehadiran</button>

        <p id="pesan" class="status-msg">Berhasil! Kehadiran telah dicatat.</p>
    </div>

    <script>
        /* Logika Sederhana (JavaScript) */
        function kirimAbsen() {
            const nama = document.getElementById('nama').value;
            const pesan = document.getElementById('pesan');

            if (nama === "") {
                alert("Tolong isi nama kamu ya!");
            } else {
                pesan.style.display = "block";
                pesan.innerText = "Halo " + nama + ", kamu berhasil absen hari ini!";
                
                // Menghilangkan pesan setelah 3 detik
                setTimeout(() => {
                    pesan.style.display = "none";
                }, 3000);
            }
        }
    </script>

</body>
</html>
